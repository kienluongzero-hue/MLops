[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-mlops"
version = "0.1.0"
description = "Reproducible predictive maintenance MLOps course project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib==1.6.0",
  "numpy==2.5.5",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
train = ["mlflow==3.18.0", "xgboost==3.4.1"]
report = ["matplotlib==3.11.2"]
dev = ["dvc>=3.60,<4", "httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
